 if(kd==="note"&&+n<40)return `PAD r${Math.floor(n/8)+1} c${n%8+1}`;
 const rows={48:"REC ARM",49:"SOLO",50:"ACTIVATOR",51:"SELECT",52:"CLIP STOP",66:"X-FADE A/B"};
 if(kd==="note"&&rows[n])return `${rows[n]} ${ch}`;
